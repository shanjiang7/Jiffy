# Weak scaling (camera-ready), spiral-raster, P = 64, accuracy target tol1e7.
# The problem grows by repeating the motif: 64 motif(s) for a 64-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 130 steps @ 10 us, 0.01 K.
[include]
base = ../../examples/hybrid_spiral_raster.ini

[path.hybrid_spiral_raster]
repeats = 64

[run]
steps_per_segment = 130

[dependency]
level_K = 0.01
