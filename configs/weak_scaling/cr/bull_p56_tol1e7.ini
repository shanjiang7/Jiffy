# Weak scaling (camera-ready), Bull path, P = 56, accuracy target tol1e7.
# Horizontal extent scales by sqrt(P): 50 mm * sqrt(56) = 374.166mm.
# Calibrated (Lseg, epsilon) pair from Table I: 130 steps @ 10 us, 0.01 K.
[include]
base = ../../examples/fast_heat.ini

[path.picture]
# Image paths resolve relative to THIS file's directory (path_loader.py);
# the inherited ../images/ would point inside weak_scaling/, hence the override.
image = ../../images/longhorn.jpg
horizontal = 374.166mm

[run]
steps_per_segment = 130

[dependency]
level_K = 0.01
