# Weak scaling (camera-ready), continuous-hybrid, P = 40, target tol1e4.
# The problem grows by repeating the unit: 40 unit(s) for a 40-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 90 steps @ 10 us, 5 K.
[include]
base = ../../examples/continuous_hybrid.ini

[path.continuous_hybrid]
repeats = 40

[run]
steps_per_segment = 90

[dependency]
level_K = 5
