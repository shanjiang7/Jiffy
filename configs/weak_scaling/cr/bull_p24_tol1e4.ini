# Weak scaling (camera-ready), Bull path, P = 24, accuracy target tol1e4.
# Horizontal extent scales by sqrt(P): 50 mm * sqrt(24) = 244.949mm.
# Calibrated (Lseg, epsilon) pair from Table I: 90 steps @ 10 us, 5 K.
[include]
base = ../../examples/fast_heat.ini

[path.picture]
# Image paths resolve relative to THIS file's directory (path_loader.py);
# the inherited ../images/ would point inside weak_scaling/, hence the override.
image = ../../images/longhorn.jpg
horizontal = 244.949mm

[run]
steps_per_segment = 90

[dependency]
level_K = 5
