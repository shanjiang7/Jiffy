# Weak scaling (camera-ready), spiral-raster, P = 1, accuracy target tol1e4.
# The problem grows by repeating the motif: 1 motif(s) for a 1-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 90 steps @ 10 us, 5 K.
[include]
base = ../../examples/hybrid_spiral_raster.ini

[path.hybrid_spiral_raster]
repeats = 1

[run]
steps_per_segment = 90

[dependency]
level_K = 5
