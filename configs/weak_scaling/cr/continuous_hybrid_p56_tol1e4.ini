# Weak scaling (camera-ready), continuous-hybrid, P = 56, target tol1e4.
# The problem grows by repeating the unit: 56 unit(s) for a 56-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 90 steps @ 10 us, 5 K.
[include]
base = ../../examples/continuous_hybrid.ini

[path.continuous_hybrid]
repeats = 56

[run]
steps_per_segment = 90

[dependency]
level_K = 5
