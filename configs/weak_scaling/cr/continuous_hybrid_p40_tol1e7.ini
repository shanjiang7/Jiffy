# Weak scaling (camera-ready), continuous-hybrid, P = 40, target tol1e7.
# The problem grows by repeating the unit: 40 unit(s) for a 40-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 130 steps @ 10 us, 0.01 K.
[include]
base = ../../examples/continuous_hybrid.ini

[path.continuous_hybrid]
repeats = 40

[run]
steps_per_segment = 130

[dependency]
level_K = 0.01
