# Weak scaling, spiral-raster, P = 56, target tol1e4.
# The problem grows by repeating the unit: 56 unit(s) for a 56-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 90 steps @ 10 us, 5 K.
[include]
base = ../examples/spiral_raster.ini

[path.spiral_raster]
repeats = 56

[run]
steps_per_segment = 90

[dependency]
level_K = 5
