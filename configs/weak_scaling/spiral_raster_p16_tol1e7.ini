# Weak scaling, spiral-raster, P = 16, target tol1e7.
# The problem grows by repeating the unit: 16 unit(s) for a 16-rank run.
# Calibrated (Lseg, epsilon) pair from Table I: 130 steps @ 10 us, 0.01 K.
[include]
base = ../examples/spiral_raster.ini

[path.spiral_raster]
repeats = 16

[run]
steps_per_segment = 130

[dependency]
level_K = 0.01
