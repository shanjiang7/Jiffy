# Weak scaling, Bull path, P = 24, accuracy target tol1e7.
# Horizontal extent scales by sqrt(P): 50 mm * sqrt(24) = 244.949mm.
# Calibrated (Lseg, epsilon) pair from Table I: 130 steps @ 10 us, 0.01 K.
[include]
base = ../examples/bull.ini

[path.picture]
# Image paths resolve relative to THIS file's directory (path_loader.py),
# so the inherited value must be restated here.
image = ../images/longhorn.jpg
horizontal = 244.949mm

[run]
steps_per_segment = 130

[dependency]
level_K = 0.01
