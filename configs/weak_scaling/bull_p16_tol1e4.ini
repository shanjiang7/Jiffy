# Weak scaling (camera-ready), Bull path, P = 16, accuracy target tol1e4.
# Horizontal extent scales by sqrt(P): 50 mm * sqrt(16) = 200mm.
# Calibrated (Lseg, epsilon) pair from Table I: 90 steps @ 10 us, 5 K.
[include]
base = ../examples/bull.ini

[path.picture]
# Image paths resolve relative to THIS file's directory (path_loader.py),
# so the inherited value must be restated here.
image = ../images/longhorn.jpg
horizontal = 200mm

[run]
steps_per_segment = 90

[dependency]
level_K = 5
