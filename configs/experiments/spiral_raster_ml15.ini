# Multi-layer spiral-raster path for the 8-64-rank strong scaling: 15 layers x 1,957 SS = 29,355 supersegments (~3.8M steps).
# Everything else matches spiral_raster.ini; the crossing-point partition
# DP engages automatically above the 4,096-SS dense limit, with charged
# spans clamped at layer ends.
[include]
base = ../examples/spiral_raster.ini

[layers]
num_layers = 15
