# Bull path with a very loose retention threshold (level_K = 5 K). Loosest end
# of the epsilon sweep: shallow cut depths, minimal corrections. Everything else
# (Lseg, ROI, chords pair test, chord lookup source) matches fast_heat.ini, so
# this isolates the effect of epsilon on strong-scaling speedup.
[include]
base = ../examples/fast_heat.ini

[dependency]
level_K = 5.0
