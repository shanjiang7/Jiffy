# Multi-layer continuous-hybrid (spiral-raster) for the camera-ready 8-64
# strong scaling: 15 layers x 1,957 SS = 29,355 supersegments (~3.8M steps).
# Everything else matches continuous_hybrid.ini; the crossing-point partition
# DP engages automatically above the 4,096-SS dense limit, with charged
# spans clamped at layer ends.
[include]
base = ../examples/continuous_hybrid.ini

[layers]
num_layers = 15
