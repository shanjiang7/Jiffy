# Multi-layer Bull for the camera-ready 8-64 strong scaling (experiment 2b):
# 15 layers x 1,678 SS = 25,170 supersegments (~3.27M steps). Everything else
# matches fast_heat.ini; the crossing-point partition DP engages automatically
# above the 4,096-SS dense limit, with charged spans clamped at layer ends.
[include]
base = ../examples/fast_heat.ini

[layers]
num_layers = 15
