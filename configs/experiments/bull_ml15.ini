# Multi-layer Bull for the 8-64-rank strong scaling:
# 15 layers x 1,678 SS = 25,170 supersegments (~3.27M steps). Everything else
# matches bull.ini; the crossing-point partition DP engages automatically
# above the 4,096-SS dense limit, with charged spans clamped at layer ends.
[include]
base = ../examples/bull.ini

[layers]
num_layers = 15
