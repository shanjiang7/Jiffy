[diagnostic_check]
# Buffer factor for the stricter validation DAG:
#   level_K_buffer = level_K_production / gamma
gamma = 20.0

# Pass criterion for max relative L2 difference between buffer and production.
tol = 1e-4

# Diagnostic snapshots must use a global stride so normal/buffer filenames match.
snap_every_steps = 20

compare = rel_l2
