# Smoke-test config for accuracy verification (paper Table IV calibration).
# Calibrated pair: Lseg = 0.9 mm (90 steps @ v=1 m/s, dt=10 us), epsilon = 5 K.
# Short straight line to exercise serial-vs-parallel comparison quickly.
[include]
base = ../examples/path_base.ini

[run]
steps_per_segment = 90

[dependency]
level_K = 5

[path.single]
x0 = 0mm
y0 = 0mm
length = 21.6mm
dir = +x

path_name = straight_line_smoke
