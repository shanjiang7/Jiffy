# Spiral-raster (continuous hybrid) with a loose retention threshold
# (level_K = 5 K), the calibrated 1e-4 error target. Pairs with
# configs/dev/sim_ex1_cg1e5.ini (CG 1e-5, matched to the target) for the
# parametric study's low-accuracy production configuration; Lseg (1.3 mm)
# and grid match examples/continuous_hybrid.ini.
[include]
base = ../examples/continuous_hybrid.ini

[dependency]
level_K = 5.0
