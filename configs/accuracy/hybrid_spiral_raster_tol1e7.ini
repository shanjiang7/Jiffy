# Accuracy study config (paper Table V): target rel-L2 = 1e-7.
# Calibrated pair from Table I: Lseg = 1.3 mm (130 steps @ v=1 m/s, dt=10 us) -> rel-L2 9.79e-8,
# with epsilon = 0.01 K. (The paper quotes 1.25 mm; per Table I that segment length calibrates
# to ~2.4e-7 and met the 1e-7 target only via a since-fixed off-by-one in the correction horizon.)
[include]
base = ../examples/path_base.ini

[run]
steps_per_segment = 130

[dependency]
level_K = 0.01

[path.hybrid_spiral_raster]
x0 = 0mm
y0 = 0mm
spiral_side = 8mm
spiral_pitch = 200um
spiral_dir = inward
raster_width = 4mm
raster_line_pitch = 200um
gap = 150um
tile_gap = 200um
repeats = 5
raster_dir = +1
tile_connector_source_on = on

path_name = spiral_raster
