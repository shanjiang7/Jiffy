# Accuracy study config (paper Table IV): target rel-L2 = 1e-4.
# Calibrated pair from Table I: Lseg = 0.9 mm (90 steps @ v=1 m/s, dt=10 us), epsilon = 5 K.
[include]
base = ../examples/path_base.ini

[run]
steps_per_segment = 90

[dependency]
level_K = 5

[path.hybrid_spiral_raster]
x0 = 0mm
y0 = 0mm
spiral_side = 8mm
spiral_pitch = 200um
spiral_dir = inward
raster_width = 4mm
raster_line_pitch = 200um
gap = 150um
tile_gap = 200um
repeats = 5
raster_dir = +1
# Tile connectors travel with the laser OFF (builder default; decided
# 2026-07-29): off-power moves deposit nothing, so the source-on-only
# comparison filter excludes them automatically.
tile_connector_source_on = off

path_name = spiral_raster
