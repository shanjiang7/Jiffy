# Bull path accuracy study (paper Table IV): target rel-L2 = 1e-4.
# Calibrated pair from Table I: Lseg = 0.9 mm (90 steps @ v=1 m/s, dt=10 us),
# epsilon = 5 K. Lookup source inherits path_base default (chord).
[include]
base = ../examples/bull.ini

[run]
steps_per_segment = 90

[dependency]
level_K = 5
