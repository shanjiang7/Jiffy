[trajectory]
len_scale = 1.0

[run]
steps_per_segment = 100
segments_per_supersegment = 1
width_roi_m = 0.5mm
segment_P_W = 200.0
segment_V_mps = 1.0
segment_t0_s = 0.0

[dependency]
# Epsilon threshold for ΔT on the top surface (K)
level_K = 0.1

# Sample one moving target patch every N steps when testing DAG edges
target_patch_step_stride = 20

# EagarTsai simulation parameters for r_eps lookup
resolution_m = 20e-6
bc = temp
spacing_m = 200e-6
window_x_um = 4800
window_y_um = 4800
window_z_um = 2400

# Numerical mock source duration in lookup build (unit: solver steps)
mock_numerical_source_steps = 1

[layers] 
num_layers = 1

[dag]
back_window = 100
node_mode = atomic_closure
