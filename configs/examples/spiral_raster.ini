[include]
base = path_base.ini

# THE spiral-raster path (paper: "hybrid spiral-raster"): each unit is an
# interleaved double square spiral (in on thread A, out on thread B, uniform
# 200 um track spacing, no thread crossings) bridged to a serpentine raster
# through the spiral's track-free mouth corridor. The whole path is ONE
# uninterrupted laser-on stroke: no travel moves, no connectors, nothing
# retraced. Replaced the earlier discontinuous inward-spiral construction
# (2026-07-30): 10x lower cut-boundary error at the loose tolerance and a
# smooth refinement ladder (see git history for the old builder).
[path.spiral_raster]
x0 = 0mm
y0 = 0mm
spiral_side = 8mm
track_pitch = 200um
raster_width = 4mm
raster_line_pitch = 200um
gap = 200um
tile_gap = 200um
repeats = 5

path_name = spiral_raster
