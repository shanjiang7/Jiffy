[trajectory]
len_scale = 1.0

[run]
# Segment length: Lseg = steps_per_segment * v * dt = 130 * 1 m/s * 10 us = 1.3 mm.
# Calibrated pair with [dependency].level_K below (paper Table I / Table V:
# Lseg = 1.3 mm <-> rel-L2 9.79e-8, meeting the 1e-7 target with epsilon = 0.01 K).
steps_per_segment = 130
segments_per_supersegment = 1
# Target-patch half-extent in the DAG dependency test; matches the 1 mm
# error-evaluation ROI (crop_snapshot / calibration region).
width_roi_m = 1mm
segment_P_W = 200.0
segment_V_mps = 1.0
segment_t0_s = 0.0

[dependency]
# Epsilon threshold for ΔT on the top surface (K).
# Paper default (SC26 §III-A): 0.01 K. Must stay paired with the calibrated
# steps_per_segment above; for the low-accuracy pair use 5 K with 90 steps
# (Lseg = 0.9 mm, rel-L2 target 1e-4), see configs/*_tol1e4.ini.
level_K = 0.01

# Sample one moving target patch every N steps when testing DAG edges
# (used by pair_test = aabb)
target_patch_step_stride = 20

# Pairwise retention test: "aabb" (paper behaviour) or "chords"
# (exact chord-to-chord distances with per-chord deposit times).
pair_test = chords
# Number of evenly spaced path samples per segment -> segment_samples-1 chords.
segment_samples = 5
# Mock-source duration for the numerical r_eps lookup:
#   "chord"   - one chord of deposit (steps_per_segment/(segment_samples-1)
#               steps), matching the geometric unit the chords pair test
#               retains edges for. Validated on the hybrid spiral-raster path
#               at both tolerance targets (max rel-L2 1.6e-8 @ 1e-4 target,
#               1.3e-8 @ 1e-7 target) with a 2.4x shallower DAG than "segment".
#   "segment" - a full segment; most conservative (whole-segment influence,
#               the quantity the Table I calibration defines epsilon against).
#   integer   - explicit step count; 1 reproduces the published single-pulse
#               AABB-era lookup. Unsafe with pair_test = chords, whose
#               empty-isotherm pruning then truncates the thermal horizon of
#               dense paths (e.g. the hybrid spiral centre).
lookup_source_on_steps = chord

# EagarTsai simulation parameters for r_eps lookup
resolution_m = 20e-6
bc = temp
spacing_m = 200e-6
window_x_um = 4800
window_y_um = 4800
window_z_um = 2400

# Numerical mock source duration in lookup build (unit: solver steps)
mock_numerical_source_steps = 1

[layers] 
num_layers = 1

[dag]
back_window = 200
