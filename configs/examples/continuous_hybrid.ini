[include]
base = path_base.ini

# Continuous-hybrid path (fifth path, added for the self-convergence study):
# each unit is an interleaved double square spiral (in on thread A, out on
# thread B, uniform 200 um track spacing, no thread crossings) bridged to a
# serpentine raster through the spiral's track-free mouth corridor. The whole
# path is ONE uninterrupted laser-on stroke: no travel moves, no connectors,
# nothing retraced. Same tile sizes and pitch as hybrid_spiral_raster.
[path.continuous_hybrid]
x0 = 0mm
y0 = 0mm
spiral_side = 8mm
track_pitch = 200um
raster_width = 4mm
raster_line_pitch = 200um
gap = 200um
tile_gap = 200um
repeats = 5

path_name = continuous_hybrid
