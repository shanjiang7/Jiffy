name: hermes
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.3.5
      - scipy==1.17.0
      - cupy-cuda12x==13.6.0
      - numba==0.63.1
      - mpi4py==4.1.1        # builds against the system MPI (load your MPI module first)
      - matplotlib==3.10.8
      - networkx==3.6.1
      - pillow==12.1.0
      - scikit-image==0.26.0  # image-based scan paths (Bull, texas)
      # Visualization only (post/ VTK export for the melt-history figures):
      - vtk==9.5.2
      - mayavi==4.8.3
